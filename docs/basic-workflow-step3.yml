# STEP 3 (basic version) - kept here for reference only.
# This was the first workflow: it runs the tests on EVERY push to ANY branch.
# The improved version (Step 4) is in .github/workflows/tests.yml
name: Run Unit Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code from the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest and pytest-cov
        run: python -m pip install -r requirements.txt

      - name: Run the unit tests with coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing
