# STEP 4 (improved version)
# Goal: run tests only when it matters, and never waste runs on old commits.
name: Run Unit Tests

on:
  # 1. Pushes to main (e.g. after a pull request is merged) are always tested
  push:
    branches: [main]
    paths:                       # ...but only if code / tests / setup changed
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

  # 2. Feature-branch work is tested when it is proposed for main (pull request)
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

  # 3. A "Run workflow" button in the Actions tab (handy for the demo)
  workflow_dispatch:

# 4. If a newer push arrives while an older run is still going on the same
#    branch / pull request, cancel the old run - only the latest code matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 5. Skip draft pull requests (work still in progress, e.g. AI-assisted edits).
    #    Tests start when the PR is marked "Ready for review".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Get the code from the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pytest and pytest-cov
        run: python -m pip install -r requirements.txt

      - name: Run the unit tests with coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing
